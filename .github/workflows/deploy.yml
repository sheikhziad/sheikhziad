name: Deploy site to GitHub Pages

on:
  push:
    branches: [portfolio-rebuild-2026]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Repo is served at sheikhziad.github.io/sheikhziad/ — keep this
      # in sync if the repo is ever renamed to sheikhziad.github.io.
      NEXT_PUBLIC_BASE_PATH: /sheikhziad
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static export
        run: bun run build

      # Next.js writes assets under _next/. GitHub Pages defaults to
      # running Jekyll, which strips folders starting with _. .nojekyll
      # disables that and lets the assets through.
      - name: Disable Jekyll
        run: touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
